# Pacote de deploy (Fase 2b, docs/deploy.md).
#
# Sempre com o arquivo de ambiente FORA do repositório:
#   docker compose --env-file <arquivo> -f deploy/compose.yaml up -d --build
# (Windows: %USERPROFILE%\.quadro\deploy.env; VPS: /etc/quadro/deploy.env com chmod 600.)
#
# - O Caddy é dono do namespace de rede; o app entra nele e o Node escuta só em
#   127.0.0.1:3001 (nunca exposto). Assim um restart do app não derruba o site.
# - Cada serviço recebe só as próprias chaves: o segredo do Google só no app,
#   a chave do bucket só no Litestream.
# - Volumes nomeados (um bind mount no Windows quebra o WAL do SQLite).
name: quadro

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    ports:
      # 127.0.0.1 no teste local; na VPS, o IPv4 público dela (BIND_IP).
      - "${BIND_IP:-127.0.0.1}:80:80"
      - "${BIND_IP:-127.0.0.1}:443:443"
      - "${BIND_IP:-127.0.0.1}:443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?defina APP_DOMAIN}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:?defina HSTS_MAX_AGE (0 no teste local, 31536000 ou mais na VPS)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - "no-new-privileges:true"
    logging: *logging

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: quadro-tarefas:local
    restart: unless-stopped
    network_mode: "service:caddy"
    depends_on:
      - caddy
    # Sem uma destas (Google, admin, contato, responsável), o servidor recusa subir
    # e diz qual falta (server/src/deployMode.ts); o valor nunca vai para o log.
    environment:
      NODE_ENV: production
      DB_PATH: /data/quadro.sqlite
      APP_ORIGIN: ${APP_ORIGIN:?defina APP_ORIGIN (https://...)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      QUADRO_ADMIN_EMAIL: ${QUADRO_ADMIN_EMAIL:-}
      QUADRO_CONTACT_EMAIL: ${QUADRO_CONTACT_EMAIL:-}
      QUADRO_OPERATOR_NAME: ${QUADRO_OPERATOR_NAME:-}
      QUADRO_DB_MAX_MB: ${QUADRO_DB_MAX_MB:-1024}
    volumes:
      - dados:/data
    read_only: true
    tmpfs:
      - /tmp
    init: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    logging: *logging

  litestream:
    image: litestream/litestream:0.5.18@sha256:513bff62a88fc0c86c73d27333c41c54c89fe890a7c32a551600adff9309b11b
    restart: unless-stopped
    command: ["replicate"]
    # O mesmo uid do usuário node do app: o Litestream escreve ao lado do banco.
    user: "1000:1000"
    depends_on:
      app:
        condition: service_healthy
    environment:
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:-}
      LITESTREAM_PATH: ${LITESTREAM_PATH:-quadro}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
      LITESTREAM_REGION: ${LITESTREAM_REGION:-}
      AWS_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    volumes:
      - dados:/data
      # Obrigatório: ./litestream.local.yml no teste, ./litestream.yml (bucket) na VPS.
      - ${LITESTREAM_CONFIG:?defina LITESTREAM_CONFIG}:/etc/litestream.yml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    logging: *logging

volumes:
  dados:
  caddy_data:
  caddy_config:
